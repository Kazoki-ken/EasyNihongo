<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sakura Gakuen - Yodlash</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Default: Dark Mode */
            --bg-body: #000000;
            --bg-main: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #adb5bd;
            --border-color: rgba(255,255,255,0.05);
            --nav-bg: #1e1e1e;

            /* Sakura Pink Palette */
            --accent-primary: #ff6b81;
            --accent-secondary: #ff8fab;
            --accent-bg: rgba(255, 107, 129, 0.1);
        }

        /* Light Mode Override */
        body.light-mode {
            --bg-body: #f8f9fa;
            --bg-main: #ffffff;
            --card-bg: #f1f3f5;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border-color: rgba(0,0,0,0.05);
            --nav-bg: #ffffff;
            --accent-bg: rgba(255, 107, 129, 0.05);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 90px;
            overflow-x: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Main App Container */
        .app-container {
            width: 100%;
            background-color: var(--bg-main);
            min-height: 100vh;
            position: relative;
        }

        /* Header (Clean & Modern) */
        .app-header {
            background-color: var(--bg-main);
            padding: 20px 20px 10px 20px;
            padding-top: 50px; /* Mobile safe area default */
            position: sticky;
            top: 0;
            z-index: 1000;
            /* border-bottom: 1px solid var(--border-color); */ /* Removed border for cleaner look */
            margin: 0 auto;
            width: 100%;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            display: flex; align-items: center;
        }
        .header-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* Theme Toggle Icon */
        .theme-toggle-icon {
            position: absolute;
            top: 50px; right: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Tabs (Modern Pill Shape) */
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px; /* For scrollbar */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-pill {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .tab-pill.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.3);
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin-bottom: 25px;
        }
        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border-radius: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .search-icon {
            position: absolute;
            left: 15px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 0 20px 20px 20px;
        }

        /* Wide Feature Card (All Words) */
        .feature-card {
            grid-column: 1 / -1; /* Spans full width */
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            min-height: 100px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .feature-card:active { transform: scale(0.98); }

        .feature-icon-circle {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: var(--accent-primary);
        }

        .feature-title {
            font-size: 1rem;
            font-weight: 700;
        }

        /* Topic Grid (2 Columns) */
        .topic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .topic-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            transition: transform 0.2s, border-color 0.3s;
            position: relative;
            overflow: hidden;
            height: 100%;
            justify-content: center;
        }
        .topic-card:active { transform: scale(0.95); }
        .topic-card:hover { border-color: var(--accent-primary); }

        .topic-icon-box {
            width: 50px; height: 50px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
            font-size: 1.6rem;
            /* Gradient Backgrounds for Icons */
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
        }

        /* Custom Icon Colors per Topic */
        .icon-n5 { color: #60a5fa; background: rgba(96, 165, 250, 0.1); }
        .icon-week { color: #f472b6; background: rgba(244, 114, 182, 0.1); }
        .icon-time { color: #fbbf24; background: rgba(251, 191, 36, 0.1); }
        .icon-nature { color: #34d399; background: rgba(52, 211, 153, 0.1); }

        .topic-title {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.3;
        }

        /* Lock Overlay */
        .locked-overlay {
            position: absolute;
            top: 10px; right: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Desktop Layout (Responsive) */
        @media (min-width: 992px) {
            .app-container {
                max-width: 1200px;
                margin: 0 auto;
                background-color: transparent;
                padding: 40px 20px;
                min-height: auto;
                display: block;
            }
            .app-header {
                background: transparent;
                padding-top: 20px;
                position: relative;
            }
            .content-grid {
                grid-template-columns: 350px 1fr; /* Sidebar + Main */
                align-items: start;
                padding: 0;
                gap: 30px;
            }
            .topic-grid {
                grid-template-columns: repeat(3, 1fr); /* 3 cols on desktop */
            }
        }

        /* Bottom Nav Styes (Imported from base.html styles if needed, but here we just include the structure) */
        /* The included bottom_nav.html relies on base styles or styles defined here */
        .bottom-nav {
             background: var(--nav-bg);
             border-top: 1px solid var(--border-color);
        }
        .nav-item-custom {
            color: var(--text-muted);
        }
        .nav-item-custom.active {
            color: var(--accent-primary);
        }

    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <div class="header-title">
                        <i class="bi bi-collection-fill text-sakura me-2"></i>
                        O'quv Bo'limlari
                    </div>
                    <div class="header-subtitle">O'rganmoqchi bo'lgan darsingizni tanlang</div>
                </div>
                <i class="bi bi-moon-stars theme-toggle-icon" id="theme-toggle"></i>
            </div>

            <!-- Tabs -->
            <div class="tabs-container">
                <a href="#" class="tab-pill active">Asosiy</a>
                <a href="#" class="tab-pill">Kitoblar</a>
                <a href="#" class="tab-pill">Tez orada</a>
            </div>

            <!-- Search -->
            <div class="search-box">
                <i class="bi bi-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Bo'limni qidirish...">
            </div>
        </div>

        <div class="content-grid">

            <!-- Left Side (or Top on Mobile) -->
            <div class="feature-section">
                <!-- All Words Card -->
                <a href="{% url 'dashboard' %}" class="feature-card mb-3">
                    <div class="feature-icon-circle">
                        <i class="bi bi-journals"></i>
                    </div>
                    <div class="feature-title">Hamma so'zlar</div>
                </a>
            </div>

            <!-- Main Topic Grid -->
            <div class="topic-grid">

                <!-- Topic 1: N5 -->
                <a href="#" class="topic-card">
                    <div class="topic-icon-box icon-n5">
                        <i class="bi bi-journal-text"></i>
                    </div>
                    <div class="topic-title">JLPT N5</div>
                </a>

                <!-- Topic 2: Hafta kunlari -->
                <a href="#" class="topic-card">
                    <div class="topic-icon-box icon-week">
                        <i class="bi bi-calendar-event"></i>
                    </div>
                    <div class="topic-title">Hafta kunlari</div>
                </a>

                <!-- Topic 3: Vaqt -->
                <a href="#" class="topic-card">
                    <div class="topic-icon-box icon-time">
                        <i class="bi bi-clock"></i>
                    </div>
                    <div class="topic-title">Vaqt</div>
                </a>

                <!-- Topic 4: Vaqt Tabiati -->
                <a href="#" class="topic-card">
                    <div class="topic-icon-box icon-nature">
                        <i class="bi bi-tree"></i>
                    </div>
                    <div class="topic-title">Tabiat</div>
                </a>

                 <!-- Topic 5: Oila -->
                <a href="#" class="topic-card">
                    <div class="topic-icon-box" style="color: #a78bfa; background: rgba(167, 139, 250, 0.1);">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <div class="topic-title">Oila</div>
                </a>

                 <!-- Topic 6: Sayohat -->
                <a href="#" class="topic-card">
                    <div class="topic-icon-box" style="color: #f87171; background: rgba(248, 113, 113, 0.1);">
                        <i class="bi bi-airplane-fill"></i>
                    </div>
                    <div class="topic-title">Sayohat</div>
                </a>

            </div>
        </div>

        <!-- Replaced hardcoded nav with Include -->
        {% include 'vocabulary/includes/bottom_nav.html' %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // SYNC WITH GLOBAL THEME
        const STORAGE_KEY = 'sakura_theme_vfinal';

        function applyTheme(theme) {
            if (theme === 'light' || !theme) {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        }

        applyTheme(localStorage.getItem(STORAGE_KEY));

        const toggleBtn = document.getElementById('theme-toggle');
        if(toggleBtn){
            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('light-mode');
                const isLight = document.body.classList.contains('light-mode');
                const newTheme = isLight ? 'light' : 'dark';
                localStorage.setItem(STORAGE_KEY, newTheme);
                window.dispatchEvent(new Event('storage'));
            });
        }

        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY) {
                applyTheme(event.newValue);
            }
        });
    </script>
</body>
</html>
