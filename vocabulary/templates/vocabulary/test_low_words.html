{% extends 'vocabulary/base.html' %}

{% block content %}

<style>
    /* Sakura Theme Variables */
    :root {
        --sakura-pink-primary: #ff6b81;
        --sakura-pink-secondary: #ff8fab;
        --sakura-bg-light: #fff0f5;
        --sakura-text-dark: #2c3e50;
        --sakura-text-muted: #6c757d;
    }

    .low-words-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        text-align: center;
        padding: 20px;
    }

    /* Soft Pink Icon Circle */
    .warning-icon-circle {
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, #ffc3a0 0%, #ffafbd 100%); /* Soft peach/pink gradient */
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        box-shadow: 0 10px 20px rgba(255, 107, 129, 0.2);
    }

    .warning-icon {
        font-size: 3.5rem;
        color: white;
    }

    .warning-title {
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 15px;
        color: var(--sakura-text-dark);
    }

    .warning-desc {
        color: var(--sakura-text-muted);
        font-size: 1rem;
        max-width: 320px;
        margin-bottom: 40px;
        line-height: 1.6;
    }

    .count-badge {
        font-weight: 800;
        color: var(--sakura-pink-primary);
        font-size: 1.1em;
    }

    /* Sakura Button (Primary) */
    .btn-sakura-primary {
        background: linear-gradient(135deg, var(--sakura-pink-primary) 0%, var(--sakura-pink-secondary) 100%);
        color: white;
        border: none;
        padding: 16px 20px;
        border-radius: 20px; /* Matching the game card radius */
        width: 100%;
        max-width: 320px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        font-size: 1rem;
        box-shadow: 0 8px 16px rgba(255, 107, 129, 0.3);
        transition: transform 0.2s, box-shadow 0.2s;
        text-decoration: none;
    }

    .btn-sakura-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 20px rgba(255, 107, 129, 0.4);
        color: white;
    }

    .btn-sakura-primary:active {
        transform: scale(0.98);
    }

    /* Sakura Button (Secondary/Outline) */
    .btn-sakura-outline {
        background-color: transparent;
        color: var(--sakura-pink-primary);
        border: 2px solid var(--sakura-pink-primary);
        padding: 14px 20px;
        border-radius: 20px;
        width: 100%;
        max-width: 320px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        font-size: 1rem;
        text-decoration: none;
        transition: all 0.2s ease;
    }

    .btn-sakura-outline:hover {
        background-color: var(--sakura-bg-light);
        color: var(--sakura-pink-primary);
        transform: translateY(-2px);
    }

    .icon-wrapper {
        margin-right: 10px;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
    }

    .back-link {
        color: var(--sakura-text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        transition: color 0.2s;
        display: flex;
        align-items: center;
    }

    .back-link:hover {
        color: var(--sakura-pink-primary);
    }

    /* Dark Mode Adjustments */
    body.dark-mode .warning-title {
        color: #f8f9fa;
    }
    body.dark-mode .warning-desc {
        color: #adb5bd;
    }
    body.dark-mode .btn-sakura-outline {
        border-color: var(--sakura-pink-secondary);
        color: var(--sakura-pink-secondary);
    }
    body.dark-mode .btn-sakura-outline:hover {
        background-color: rgba(255, 107, 129, 0.1);
    }

</style>

<div class="low-words-container">

    <!-- Icon Circle -->
    <div class="warning-icon-circle">
        <i class="bi bi-journal-plus warning-icon"></i>
    </div>

    <!-- Title -->
    <div class="warning-title">
        So'z yetarli emas
    </div>

    <!-- Description -->
    <div class="warning-desc">
        Ushbu o'yinni boshlash uchun lug'atingizda kamida <span class="count-badge">4 ta</span> so'z bo'lishi kerak.
    </div>

    <!-- Add Word Button (Primary) -->
    <a href="{% url 'add_word' %}" class="btn-sakura-primary">
        <div class="icon-wrapper">
            <i class="bi bi-plus-lg"></i>
        </div>
        Yangi so'z qo'shish
    </a>

    <!-- Select Category Button (Secondary) -->
    <a href="{% url 'categories' %}" class="btn-sakura-outline">
        <div class="icon-wrapper">
            <i class="bi bi-collection-play"></i>
        </div>
        Bo'limlardan tanlash
    </a>

    <!-- Back Link -->
    <a href="{% url 'games_menu' %}" class="back-link">
        <i class="bi bi-arrow-left me-1"></i> O'yinlar menyusiga qaytish
    </a>

</div>

{% endblock %}
