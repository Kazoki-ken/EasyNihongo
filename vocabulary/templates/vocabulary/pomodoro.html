{% extends 'vocabulary/base.html' %}

{% block content %}
<div class="container mt-4 mb-5">
    <!-- TIMER SECTION -->
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card sakura-card p-4 text-center position-relative overflow-hidden">
                <!-- Modes (Tabs) -->
                <div class="d-flex justify-content-center mb-4 gap-2">
                    <button class="btn btn-sm btn-outline-danger active-mode" id="btn-focus" onclick="setMode('focus')">Focus</button>
                    <button class="btn btn-sm btn-outline-secondary" id="btn-short" onclick="setMode('short')">Short Break</button>
                    <button class="btn btn-sm btn-outline-secondary" id="btn-long" onclick="setMode('long')">Long Break</button>
                </div>

                <!-- Circular Timer -->
                <div class="position-relative d-inline-block mb-4" style="width: 220px; height: 220px;">
                    <!-- SVG Circle -->
                    <svg class="w-100 h-100" viewBox="0 0 100 100">
                        <!-- Background Circle -->
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#eee" stroke-width="5"></circle>
                        <!-- Progress Circle -->
                        <circle id="timer-progress" cx="50" cy="50" r="45" fill="none" stroke="#ff6b81" stroke-width="5"
                                stroke-dasharray="283" stroke-dashoffset="0" transform="rotate(-90 50 50)"
                                style="transition: stroke-dashoffset 1s linear;"></circle>
                    </svg>

                    <!-- Time Display -->
                    <div class="position-absolute top-50 start-50 translate-middle">
                        <h1 class="display-3 fw-bold mb-0" id="timer-display" style="color: var(--text-main, #333);">25:00</h1>
                        <small class="text-muted d-block mt-2" id="timer-status">DIQQAT</small>
                    </div>
                </div>

                <!-- Controls -->
                <div class="d-flex justify-content-center gap-3 mb-3">
                    <button class="btn btn-lg btn-danger px-4 rounded-pill shadow-sm" id="btn-start" onclick="toggleTimer()">
                        <i class="bi bi-play-fill me-1"></i> Boshlash
                    </button>
                    <button class="btn btn-lg btn-outline-secondary px-3 rounded-circle" onclick="resetTimer()" title="Reset">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TASKS SECTION -->
    <div class="row justify-content-center mt-4">
        <div class="col-md-6 col-lg-5">
            <div class="card sakura-card p-3">
                <h5 class="fw-bold mb-3"><i class="bi bi-list-check me-2 text-danger"></i>Bugungi Vazifalar</h5>

                <!-- Input -->
                <div class="input-group mb-3">
                    <input type="text" id="task-input" class="form-control border-end-0" placeholder="Yangi vazifa qo'shish..." onkeypress="handleEnter(event)">
                    <button class="btn btn-outline-danger border-start-0" type="button" onclick="addTask()">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                </div>

                <!-- List -->
                <ul class="list-group list-group-flush" id="task-list">
                    <!-- Tasks will be injected here via JS -->
                    <li class="list-group-item text-muted text-center py-3 empty-state">
                        Hozircha vazifalar yo'q
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<style>
    .active-mode {
        background-color: #ff6b81 !important;
        color: white !important;
        border-color: #ff6b81 !important;
    }
    .task-done span {
        text-decoration: line-through;
        color: #adb5bd;
    }

    /* Dark Mode Support via Base Variables */
    body.dark-mode .empty-state { color: #6c757d !important; }
    body.dark-mode #timer-display { color: #fff !important; }
    body.dark-mode circle[stroke="#eee"] { stroke: #333; }
</style>

<script>
    // --- TIMER LOGIC ---
    let timerInterval;
    let timeLeft = 25 * 60; // seconds
    let totalTime = 25 * 60;
    let isRunning = false;
    let currentMode = 'focus'; // focus, short, long

    const timerDisplay = document.getElementById('timer-display');
    const timerStatus = document.getElementById('timer-status');
    const progressCircle = document.getElementById('timer-progress');
    const startBtn = document.getElementById('btn-start');

    // Circle Circumference = 2 * PI * r (r=45) => ~283
    const circumference = 283;

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        // Update Title for tab visibility
        document.title = `${timerDisplay.textContent} - Pamidor`;

        // Update Circle
        const offset = circumference - (timeLeft / totalTime) * circumference;
        progressCircle.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
        if (isRunning) {
            pauseTimer();
        } else {
            startTimer();
        }
    }

    function startTimer() {
        if (isRunning) return;
        isRunning = true;

        // Update UI
        startBtn.innerHTML = '<i class="bi bi-pause-fill me-1"></i> To\'xtatish';
        startBtn.classList.replace('btn-danger', 'btn-warning');
        startBtn.classList.replace('text-white', 'text-dark');

        timerInterval = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                completeTimer();
            }
        }, 1000);
    }

    function pauseTimer() {
        if (!isRunning) return;
        isRunning = false;
        clearInterval(timerInterval);

        // Update UI
        startBtn.innerHTML = '<i class="bi bi-play-fill me-1"></i> Davom ettirish';
        startBtn.classList.replace('btn-warning', 'btn-danger');
        startBtn.classList.replace('text-dark', 'text-white');
    }

    function resetTimer() {
        pauseTimer();
        startBtn.innerHTML = '<i class="bi bi-play-fill me-1"></i> Boshlash';

        // Reset based on mode
        if (currentMode === 'focus') setTime(25, 'DIQQAT');
        else if (currentMode === 'short') setTime(5, 'QISQA TANAFFUS');
        else setTime(15, 'UZUN TANAFFUS');

        updateDisplay();
    }

    function completeTimer() {
        pauseTimer();
        playNotificationSound();
        startBtn.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i> Qayta boshlash';

        // Browser notification (optional)
        if (Notification.permission === "granted") {
            new Notification("Vaqt tugadi!", { body: currentMode === 'focus' ? "Tanaffus vaqti!" : "Ishga qaytish vaqti!" });
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission();
        }
    }

    function setMode(mode) {
        currentMode = mode;

        // Update Buttons
        document.querySelectorAll('.btn-group button, .d-flex button').forEach(btn => btn.classList.remove('active-mode'));

        if (mode === 'focus') {
            document.getElementById('btn-focus').classList.add('active-mode');
            setTime(25, 'DIQQAT');
            progressCircle.style.stroke = '#ff6b81'; // Pink
        } else if (mode === 'short') {
            document.getElementById('btn-short').classList.add('active-mode');
            setTime(5, 'QISQA TANAFFUS');
            progressCircle.style.stroke = '#20c997'; // Green/Teal
        } else {
            document.getElementById('btn-long').classList.add('active-mode');
            setTime(15, 'UZUN TANAFFUS');
            progressCircle.style.stroke = '#0d6efd'; // Blue
        }

        pauseTimer();
        startBtn.innerHTML = '<i class="bi bi-play-fill me-1"></i> Boshlash';
        updateDisplay();
    }

    function setTime(minutes, statusText) {
        timeLeft = minutes * 60;
        totalTime = timeLeft;
        timerStatus.textContent = statusText;
    }

    function playNotificationSound() {
        // Simple beep using Web Audio API or Audio object
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.type = 'sine';
        oscillator.frequency.value = 880; // A5
        gainNode.gain.value = 0.1;

        oscillator.start();
        setTimeout(() => oscillator.stop(), 500); // 0.5 sec beep
    }

    // --- TASKS LOGIC (LocalStorage) ---
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    let tasks = JSON.parse(localStorage.getItem('pomodoro_tasks')) || [];

    function renderTasks() {
        taskList.innerHTML = '';
        if (tasks.length === 0) {
            taskList.innerHTML = '<li class="list-group-item text-muted text-center py-3 empty-state">Hozircha vazifalar yo\'q</li>';
            return;
        }

        tasks.forEach((task, index) => {
            const li = document.createElement('li');
            li.className = `list-group-item d-flex justify-content-between align-items-center ${task.done ? 'task-done' : ''}`;

            // Safe DOM creation to prevent XSS
            const div = document.createElement('div');
            div.className = "d-flex align-items-center";
            div.style.cursor = "pointer";
            div.onclick = () => toggleTask(index);

            const icon = document.createElement('i');
            icon.className = `bi ${task.done ? 'bi-check-circle-fill text-success' : 'bi-circle text-muted'} me-3 fs-5`;

            const span = document.createElement('span');
            span.className = "fw-bold";
            span.textContent = task.text; // Safe assignment

            div.appendChild(icon);
            div.appendChild(span);

            const btn = document.createElement('button');
            btn.className = "btn btn-sm text-danger";
            btn.onclick = () => deleteTask(index);
            btn.innerHTML = '<i class="bi bi-trash"></i>';

            li.appendChild(div);
            li.appendChild(btn);
            taskList.appendChild(li);
        });
    }

    function addTask() {
        const text = taskInput.value.trim();
        if (text) {
            tasks.push({ text: text, done: false });
            saveTasks();
            taskInput.value = '';
            renderTasks();
        }
    }

    function toggleTask(index) {
        tasks[index].done = !tasks[index].done;
        saveTasks();
        renderTasks();
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        saveTasks();
        renderTasks();
    }

    function saveTasks() {
        localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks));
    }

    function handleEnter(e) {
        if (e.key === 'Enter') addTask();
    }

    // Init
    updateDisplay();
    renderTasks();

    // Request Notification Permission on load
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

</script>
{% endblock %}
