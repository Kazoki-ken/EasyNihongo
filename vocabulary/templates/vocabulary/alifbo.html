{% extends 'vocabulary/base.html' %}

{% block content %}
<div class="container mt-4 mb-5">
    <!-- Header -->
    <div class="text-center mb-4">
        <h2 style="color: #ff6b81; font-weight: bold;">Alifbo Test</h2>
        <p class="text-muted small">Hiragana o'qish mashqi</p>
    </div>

    <!-- Settings Card -->
    <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
        <div class="card-body">
            <h5 class="card-title mb-3" style="color: #ff8fab;">Sozlamalar</h5>

            <!-- Row Selection -->
            <label class="form-label text-muted small fw-bold">Qatorlarni tanlang:</label>
            <div class="d-flex flex-wrap gap-2 mb-4" id="row-selectors">
                <!-- Will be populated by JS -->
            </div>

            <!-- Length Slider -->
            <label class="form-label text-muted small fw-bold">So'z uzunligi: <span id="length-val" style="color: #ff6b81; font-weight: bold;">4</span></label>
            <input type="range" class="form-range" min="1" max="10" step="1" id="length-slider" value="4" style="accent-color: #ff6b81;">
        </div>
    </div>

    <!-- Display Card -->
    <div class="card shadow border-0 mb-4 text-center py-5" style="border-radius: 20px; background: linear-gradient(135deg, #fff5f7 0%, #ffffff 100%);">
        <div class="card-body">
            <!-- Random Word -->
            <div id="word-display" class="display-1 fw-bold mb-3" style="color: #333; min-height: 80px;">
                ...
            </div>

            <!-- Hidden Answer -->
            <div id="answer-container" class="mt-3">
                <p class="text-muted small mb-1">Javob:</p>
                <div id="answer-display" class="h2 fw-bold" style="color: #ff6b81; visibility: hidden;">
                    ...
                </div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="row g-3">
        <div class="col-6">
            <button id="btn-show" class="btn w-100 py-3 fw-bold shadow-sm" style="border: 2px solid #ff6b81; color: #ff6b81; background: white; border-radius: 12px;">
                <i class="bi bi-eye me-2"></i>Ko'rish
            </button>
        </div>
        <div class="col-6">
            <button id="btn-next" class="btn w-100 py-3 fw-bold shadow-sm text-white" style="background: linear-gradient(45deg, #ff6b81, #ff8fab); border: none; border-radius: 12px;">
                Keyingisi<i class="bi bi-arrow-right ms-2"></i>
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 1. Data Structure (Hiragana Mapping)
    const hiraganaMap = {
        'a':  [
            {h:'あ', r:'a'}, {h:'い', r:'i'}, {h:'う', r:'u'}, {h:'え', r:'e'}, {h:'お', r:'o'}
        ],
        'ka': [
            {h:'か', r:'ka'}, {h:'き', r:'ki'}, {h:'く', r:'ku'}, {h:'け', r:'ke'}, {h:'こ', r:'ko'}
        ],
        'sa': [
            {h:'さ', r:'sa'}, {h:'し', r:'shi'}, {h:'す', r:'su'}, {h:'せ', r:'se'}, {h:'そ', r:'so'}
        ],
        'ta': [
            {h:'た', r:'ta'}, {h:'ち', r:'chi'}, {h:'つ', r:'tsu'}, {h:'て', r:'te'}, {h:'と', r:'to'}
        ],
        'na': [
            {h:'な', r:'na'}, {h:'に', r:'ni'}, {h:'ぬ', r:'nu'}, {h:'ね', r:'ne'}, {h:'の', r:'no'}
        ],
        'ha': [
            {h:'は', r:'ha'}, {h:'ひ', r:'hi'}, {h:'ふ', r:'fu'}, {h:'へ', r:'he'}, {h:'ほ', r:'ho'}
        ],
        'ma': [
            {h:'ま', r:'ma'}, {h:'み', r:'mi'}, {h:'む', r:'mu'}, {h:'め', r:'me'}, {h:'も', r:'mo'}
        ],
        'ya': [
            {h:'や', r:'ya'}, {h:'ゆ', r:'yu'}, {h:'よ', r:'yo'}
        ],
        'ra': [
            {h:'ら', r:'ra'}, {h:'り', r:'ri'}, {h:'る', r:'ru'}, {h:'れ', r:'re'}, {h:'ろ', r:'ro'}
        ],
        'wa': [
            {h:'わ', r:'wa'}, {h:'を', r:'wo'}, {h:'ん', r:'n'}
        ]
    };

    // State
    // Default selection: 'a' and 'ka' as requested by user example
    let activeRows = new Set(['a', 'ka']);

    // DOM Elements
    const rowSelectorsContainer = document.getElementById('row-selectors');
    const lengthSlider = document.getElementById('length-slider');
    const lengthVal = document.getElementById('length-val');
    const wordDisplay = document.getElementById('word-display');
    const answerDisplay = document.getElementById('answer-display');
    const btnShow = document.getElementById('btn-show');
    const btnNext = document.getElementById('btn-next');

    // 2. Initialize UI
    function init() {
        // Create Row Buttons
        Object.keys(hiraganaMap).forEach(key => {
            const btn = document.createElement('button');
            // Check if active by default
            const isActive = activeRows.has(key);

            btn.className = `btn btn-sm fw-bold px-3 py-2 rounded-pill ${isActive ? 'text-white' : 'text-muted'}`;
            btn.style.border = isActive ? 'none' : '1px solid #ddd';
            btn.style.background = isActive ? '#ff6b81' : 'white';
            btn.textContent = key.toUpperCase(); // "A", "KA", "SA"...

            btn.onclick = () => toggleRow(key, btn);
            rowSelectorsContainer.appendChild(btn);
        });

        // Generate first word
        generateWord();
    }

    // 3. Toggle Logic
    function toggleRow(key, btn) {
        if (activeRows.has(key)) {
            // Cannot deselect if it's the last one
            if (activeRows.size <= 1) return;
            activeRows.delete(key);
            // Update visual to inactive
            btn.style.background = 'white';
            btn.style.color = '#6c757d'; // text-muted
            btn.style.border = '1px solid #ddd';
            btn.classList.remove('text-white');
        } else {
            activeRows.add(key);
            // Update visual to active
            btn.style.background = '#ff6b81';
            btn.style.color = 'white';
            btn.style.border = 'none';
            btn.classList.add('text-white');
        }
    }

    // 4. Generate Word Logic
    function generateWord() {
        const length = parseInt(lengthSlider.value);
        let pool = [];

        // Build pool from active rows
        activeRows.forEach(key => {
            if (hiraganaMap[key]) {
                pool = pool.concat(hiraganaMap[key]);
            }
        });

        if (pool.length === 0) {
            wordDisplay.textContent = "Tanlang!";
            return;
        }

        let wordH = "";
        let wordR = "";

        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * pool.length);
            const item = pool[randomIndex];
            wordH += item.h;
            wordR += item.r;
        }

        // Update DOM
        wordDisplay.textContent = wordH;
        answerDisplay.textContent = wordR;

        // Hide answer
        answerDisplay.style.visibility = 'hidden';
    }

    // 5. Event Listeners
    lengthSlider.addEventListener('input', (e) => {
        lengthVal.textContent = e.target.value;
        // Optionally auto-regenerate on slide end, but user might want to confirm length first.
        // Let's just update the number display for now.
    });

    btnShow.addEventListener('click', () => {
        answerDisplay.style.visibility = 'visible';
    });

    btnNext.addEventListener('click', () => {
        generateWord();
    });

    // Start
    init();
});
</script>

<!-- Mobile specific style adjustments -->
<style>
    @media (max-width: 576px) {
        #word-display {
            font-size: 3.5rem; /* Larger on mobile for visibility */
        }
        .container {
            padding-bottom: 80px; /* Space for bottom nav if present */
        }
    }
</style>
{% endblock %}
